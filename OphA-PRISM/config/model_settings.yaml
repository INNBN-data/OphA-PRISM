software_version: 1.0.1
origin: reference implementation; historical model identifier v1.2.0
seed: 42
outer_folds: 5
outer_repeats: 10
inner_folds: 4
optuna_trials: 100
imputation_backend: iterative_numeric
imputations: 20
calibration_method: isotonic
conformal_fraction: 0.2
probability_calibration_fraction: 0.2
conformal_alpha: 0.1
conformal_reporting_repeat: 0
eras:
- - 1
  - 1998
  - 2006
- - 2
  - 2007
  - 2016
- - 3
  - 2017
  - 2025
paths:
  development: cohort_flow_export_v2.csv
  holdout: holdout_cohort_v1.csv
  dictionary: data_dictionary_v2.csv
  eligible_features: eligible_t0_t2_features.txt
dictionary_columns:
  name: Variable_Name
  layer: Temporal_Layer
  eligible: Eligible_for_Preop_Prediction
models:
  VISION:
    family: elastic_net
    parameters:
      C: 0.1
      l1_ratio: 0.5
    selection:
      enabled: true
      resamples: 1000
      threshold: 0.75
      max_raw_features: 6
  ACCESS:
    family: catboost
    parameters:
      iterations: 1000
      learning_rate: 0.05
      depth: 4
    selection:
      enabled: false
  CONTROL:
    family: l1_logistic
    parameters:
      C: 0.1
    selection:
      enabled: true
      resamples: 1000
      threshold: 0.75
      max_raw_features: 6
  RECON:
    family: l1_logistic
    parameters:
      C: 0.1
    selection:
      enabled: true
      resamples: 1000
      threshold: 0.75
      max_raw_features: 6
  CURE:
    family: lightgbm
    parameters:
      n_estimators: 1000
      learning_rate: 0.05
      max_depth: 4
      num_leaves: 9
      scale_pos_weight: 4.2
    selection:
      enabled: false
