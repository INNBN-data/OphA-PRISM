[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opha-prism-reference"
version = "1.0.1"
description = "Reference analysis software for ophthalmic-segment aneurysm microsurgery"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["ophaprism*", "server_audit*"]
